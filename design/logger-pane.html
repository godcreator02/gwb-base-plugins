<!doctype html>
<!--
  日志窗格 · HTML 效果图(2026-09-08,视觉精修联动版)
  正主:plugins/logger/src/client/index.tsx(视觉精修的对象,布局骨架不动:顶栏筛选/流水/脚注三段)。
  数据:四路的 name 与消息文案按真机取——host 路的 name 是 host / stdin / loader
        (宿主 src/host/main.ts 的 KERNEL_LOGGERS),main 路 name 固定 gwb,renderer 路固定 renderer,
        plugin 路是件名。启动段那三十来条是照真机代码里的句子手摆的;运行段(~380 条)是程序
        生成的,模板池仿写,每次刷新分布略有出入。时间戳是打开页面当天 14:32:05 起的仿真推进。
  配色:gwb-base-plugins\packages\tokens\src\tokens.css 暗色档原样照抄(底 oklch(0.19…)≈#151518、
        卡 oklch(0.23…)≈#1d1d20)。另有一批**效果图自有色**(warn 琥珀、四路点色、error/warn 行底、
        来源名的中间亮度),令牌表里没有——要不要转正进令牌表,看图定。
  交互(照 client 同一个路数,全真):
    · 级别四个挡位是**门限**:点 Info 显示 Info 及以上;分段控件把「显示范围」画出来——
      选中挡实心,更严重的那几挡半亮
    · 路四个 toggle 多选,带条数(数的是筛选前全量);关掉不再是删除线,是整颗降透明
    · 来源下拉按路分组、复合键 source|name;搜索子串不分大小写,匹配 name 与 msg,无防抖
    · 清屏只清视图;空态分「一条都没有」与「被筛掉了」,后者带清筛选
    · 吸附:离底 24px 之内跟走;脱离时右下浮「已暂停吸附」胶囊,点它回底。**提示从脚注
      挪成了浮胶囊**——脚注那句与吸附状态混排是现件里没讲完的半句
    · 「模拟实时」是效果图自有的演示开关(每 700ms 追加一条),件里没有;开着才能看到吸附跟随
  摆拍两处:① 顶部标签条与 dockview 组头是对外壳的模仿;② 脚注右侧的日志目录路径取的是
        一个通用样例 home,不是真机路径。窗格本体样式全部 scope 在
        [data-gwb-plugin="@godcreator02/gwb-logger"] 之下,跟件的规矩一致(摆拍层不 scope,同实机)。
  精修点(这张图要给人看的):
    1. 日志行改 CSS grid 定宽列——时间戳/级别/路标/来源名/消息齐头,消息列不再被不定宽的
       来源名推得参差;多行消息自然保持对齐
    2. 级别从单字母徽标改成**整行色调**(error/warn 行淡色底+左缘色条),字母无框;error 之外
       的级别更安静
    3. 视觉层次重排:消息是唯一全亮,来源名从 text-primary 降到中间档,元数据退后
    4. 筛选栏分组:级别/路/来源+搜索 三组之间竖细线分隔;清屏收敛成弱化的文字按钮
    5. 脚注更低调(11px);吸附提示改浮胶囊(见上)
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日志窗格 · 效果图</title>
<style>
  /* ── gwb-tokens 暗色档(原样照抄,正本 packages/tokens/src/tokens.css 的 .dark) ── */
  :root {
    --radius: 0.625rem;
    --gwb-font-sans: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji';
    --gwb-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    --background: oklch(0.19 0.005 286.033);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.23 0.006 286.033);
    --card-foreground: oklch(0.985 0 0);
    --popover: oklch(0.23 0.006 286.033);
    --popover-foreground: oklch(0.985 0 0);
    --primary: oklch(0.92 0.004 286.32);
    --primary-foreground: oklch(0.21 0.006 285.885);
    --secondary: oklch(0.274 0.006 286.033);
    --secondary-foreground: oklch(0.985 0 0);
    --muted: oklch(0.274 0.006 286.033);
    --muted-foreground: oklch(0.705 0.015 286.067);
    --accent: oklch(0.274 0.006 286.033);
    --accent-foreground: oklch(0.985 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.552 0.016 285.938);
    /* ── 效果图自有:正本令牌表里没有,要不要转正看图定 ── */
    --warn: oklch(0.795 0.184 86.9);                       /* warn 主色,amber-400 的暗色档 */
    --src-name: oklch(0.985 0 0 / 72%);                    /* 来源名:foreground 与 muted 之间 */
    --row-error-bg: oklch(0.704 0.191 22.216 / 8%);        /* error 行底 */
    --row-warn-bg: oklch(0.795 0.184 86.9 / 7%);           /* warn 行底 */
    --src-plugin: oklch(0.623 0.214 259.815);              /* 四路点色:件(蓝,借 units 稿那个值) */
    --src-host: oklch(0.746 0.13 195);                     /* 宿主(青) */
    --src-main: oklch(0.75 0.13 70);                       /* 主(橙) */
    --src-renderer: oklch(0.72 0.14 330);                  /* 渲(紫粉) */
  }
  * { box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: var(--background); color: var(--foreground);
    font-family: var(--gwb-font-sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  svg { display: block; flex: none; }
  button { font-family: inherit; }

  /* ── 井:dockview 一组(摆拍,不 scope——外壳那层在实机本来就不 scope) ── */
  .well { height: 100%; display: flex; }
  .group { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }

  /* ── 仿外壳标签条(摆拍,非功能) ── */
  .tabbar {
    display: flex; gap: 6px; padding: 8px 10px;
    background: var(--background); border-bottom: 1px solid var(--border);
  }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 4px 10px;
    font-size: 12.5px; color: var(--muted-foreground);
    border: 1px solid transparent; border-radius: var(--radius); cursor: default;
  }
  .tab svg { width: 15px; height: 15px; }
  .tab.active { background: var(--card); border-color: oklch(1 0 0 / 9%); color: var(--foreground); }

  /* ── 仿 dockview 组头(摆拍) ── */
  .dock-head {
    display: flex; align-items: center; height: 30px; padding: 0 6px;
    background: oklch(0.21 0.005 286.033); border-bottom: 1px solid var(--border);
  }
  .dock-tab {
    display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 12px;
    font-size: 12px; color: var(--foreground);
    border-bottom: 1px solid oklch(1 0 0 / 32%); margin-bottom: -1px;
  }
  .dock-tab svg { width: 13px; height: 13px; opacity: 0.85; }
  .dock-head .spacer { flex: 1; }
  .dock-act { padding: 4px 6px; border-radius: 5px; color: var(--muted-foreground); cursor: default; }
  .dock-act:hover { background: var(--accent); color: var(--foreground); }
  .dock-act svg { width: 13px; height: 13px; }

  /* ════ 窗格本体:从这里起全部 scope 在 data-gwb-plugin 下(件的规矩) ════ */
  [data-gwb-plugin="@godcreator02/gwb-logger"] {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    background: var(--background); color: var(--card-foreground);
    font-size: 12px;
  }

  /* ── 顶栏筛选:三组之间竖细线,组内 6px ── */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    padding: 7px 10px; border-bottom: 1px solid var(--border); background: var(--card);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .bgroup {
    display: flex; align-items: center; gap: 4px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .bgroup + .bgroup {
    padding-left: 11px; margin-left: 5px; border-left: 1px solid var(--border);
  }

  /* 级别:连体分段控件,门限可视化——选中挡实心,更严重侧半亮 */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .seg {
    display: flex; padding: 2px; gap: 2px;
    background: oklch(1 0 0 / 5%); border-radius: 8px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .seg button {
    padding: 2.5px 10px; font-size: 11.5px; line-height: 1.4;
    color: var(--muted-foreground); background: transparent;
    border: 0; border-radius: 6px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .seg button:hover { color: var(--foreground); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .seg button.dim {
    color: var(--muted-foreground); background: oklch(1 0 0 / 6%);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .seg button.on {
    color: var(--primary-foreground); background: var(--primary); font-weight: 500;
  }

  /* 路:胶囊 toggle——开 secondary 底,关整颗降透明(替换掉删除线) */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px;
    font-size: 11.5px; line-height: 1.4; color: var(--secondary-foreground);
    background: var(--secondary); border: 0; border-radius: 999px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn:hover { background: var(--accent); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn .dot { width: 6px; height: 6px; border-radius: 50%; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn .n {
    font-variant-numeric: tabular-nums; opacity: 0.62; font-size: 10.5px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn.off {
    background: transparent; color: var(--muted-foreground); opacity: 0.55;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .srcbtn.off:hover { background: var(--accent); opacity: 0.8; }

  /* 来源下拉 trigger 与弹层(Radix Select 的样子;弹层挂本格容器内,仿 portal 的规矩) */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel { position: relative; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-trigger {
    display: inline-flex; align-items: center; gap: 6px; width: 150px; height: 26px;
    padding: 0 8px; font-size: 11.5px; color: var(--foreground); text-align: left;
    background: transparent; border: 1px solid var(--input); border-radius: 6px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-trigger .val {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-trigger svg { width: 13px; height: 13px; opacity: 0.6; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-pop {
    position: absolute; top: 30px; left: 0; z-index: 20; width: 176px; max-height: 300px;
    overflow: auto; padding: 4px;
    background: var(--popover); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 20px oklch(0 0 0 / 40%);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-pop[hidden] { display: none; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-glabel {
    padding: 5px 8px 2px; font-size: 10.5px; color: var(--muted-foreground);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-item {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    font-family: var(--gwb-font-mono); font-size: 11.5px; border-radius: 5px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-item:hover { background: var(--accent); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-item .tick { width: 13px; color: var(--foreground); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .sel-item svg { width: 12px; height: 12px; }

  /* 搜索:图标前置 */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .search {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 120px; height: 26px;
    padding: 0 8px; border: 1px solid var(--input); border-radius: 6px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .search:focus-within { border-color: var(--ring); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .search svg { width: 12px; height: 12px; opacity: 0.5; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--foreground); font-size: 11.5px; font-family: inherit;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .search input::placeholder { color: var(--muted-foreground); }

  /* 清屏:弱化文字按钮 */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .clearbtn {
    padding: 3px 8px; font-size: 11.5px; color: var(--muted-foreground);
    background: transparent; border: 0; border-radius: 6px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .clearbtn:hover { background: var(--accent); color: var(--foreground); }

  /* ── 流水:grid 定宽列,齐头 ── */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .flow {
    flex: 1; overflow-y: auto; overflow-x: hidden; position: relative;
    padding: 4px 0 8px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row {
    display: grid;
    grid-template-columns: 84px 16px 38px minmax(72px, 118px) 1fr;
    gap: 0 9px; align-items: baseline;
    padding: 1px 10px; min-height: 19px;
    font-family: var(--gwb-font-mono); font-size: 11.5px; line-height: 1.5;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row:hover { background: var(--accent); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.err {
    background: var(--row-error-bg); box-shadow: inset 2px 0 0 var(--destructive);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.err:hover { background: oklch(0.704 0.191 22.216 / 14%); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.warn {
    background: var(--row-warn-bg); box-shadow: inset 2px 0 0 var(--warn);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.warn:hover { background: oklch(0.795 0.184 86.9 / 12%); }

  [data-gwb-plugin="@godcreator02/gwb-logger"] .t {
    font-variant-numeric: tabular-nums; color: var(--muted-foreground); opacity: 0.78;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .lv { font-weight: 600; text-align: center; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.err .lv { color: var(--destructive); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.warn .lv { color: var(--warn); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.info .lv { color: var(--muted-foreground); opacity: 0.7; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row.debug .lv { color: var(--muted-foreground); opacity: 0.38; }

  [data-gwb-plugin="@godcreator02/gwb-logger"] .src { display: flex; align-items: baseline; gap: 5px; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .src .dot {
    width: 5px; height: 5px; border-radius: 50%; flex: none; position: relative; top: -1px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .src .w { color: var(--muted-foreground); opacity: 0.85; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .name {
    color: var(--src-name); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .row:hover .name { color: oklch(0.985 0 0 / 92%); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .msg {
    color: var(--foreground); white-space: pre-wrap; word-break: break-all; min-width: 0;
  }

  /* 空态:两态居中。display:flex 会压过 hidden 属性的 UA 样式,得自己补一条 */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .empty {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 56px 0; color: var(--muted-foreground); font-family: var(--gwb-font-sans); font-size: 12.5px;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .empty[hidden] { display: none; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .empty svg { width: 26px; height: 26px; opacity: 0.28; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .empty .ghostbtn {
    padding: 4px 12px; font-size: 12px; color: var(--foreground);
    background: var(--secondary); border: 0; border-radius: 6px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .empty .ghostbtn:hover { background: var(--accent); }

  /* 吸附浮胶囊:脱离时右下角浮起 */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .pausepill {
    position: absolute; right: 14px; bottom: 38px; z-index: 10;
    padding: 4px 12px; font-size: 11.5px; font-family: var(--gwb-font-sans);
    color: var(--popover-foreground); background: var(--popover);
    border: 1px solid var(--border); border-radius: 999px; cursor: pointer;
    box-shadow: 0 4px 14px oklch(0 0 0 / 35%);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .pausepill[hidden] { display: none; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .pausepill:hover { background: var(--accent); }

  /* ── 脚注 ── */
  [data-gwb-plugin="@godcreator02/gwb-logger"] .foot {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 3px 10px; border-top: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--muted-foreground);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .foot .left { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .foot .path {
    font-family: var(--gwb-font-mono); font-size: 10.5px; opacity: 0.85;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .livebtn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 1px 6px; font-size: 11px; color: var(--muted-foreground);
    background: transparent; border: 0; border-radius: 5px; cursor: pointer;
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .livebtn:hover { background: var(--accent); color: var(--foreground); }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .livebtn .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: oklch(0.72 0.17 145);
  }
  [data-gwb-plugin="@godcreator02/gwb-logger"] .livebtn.on .pulse { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }
</style>
</head>
<body>
<div class="well">
  <div class="group">
    <div class="tabbar">
      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg><span>对话</span><span style="font-size:11px;opacity:.75">console</span></div>

      <div class="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></div>

            <button class="sel-trigger" id="selTrigger">
              <span class="val" id="selVal">全部来源</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>

            <input id="q" type="text" placeholder="搜索 name 或消息…" autocomplete="off" spellcheck="false">

        <div class="left">
          <span id="count"></span>
          <button class="livebtn" id="live" title="效果图自有的演示开关:每 700ms 追加一条仿真日志,件里没有"><span class="pulse"></span>模拟实时</button>

<script>
'use strict'
/* ══════════════ 仿真数据 ══════════════
   四路 name 照真机:host 路是 host / stdin / loader(宿主 KERNEL_LOGGERS),
   main 路固定 gwb,renderer 路固定 renderer,plugin 路是件名。
   启动段手摆,运行段程序生成。 */

const LEVELS = ['error', 'warn', 'info', 'debug']
const SEVERITY = { error: 0, warn: 1, info: 2, debug: 3 }
const SOURCES = ['plugin', 'host', 'main', 'renderer']
const SRC_LABEL = { plugin: '件', host: '宿主', main: '主', renderer: '渲' }
const SRC_COLOR = { plugin: 'var(--src-plugin)', host: 'var(--src-host)', main: 'var(--src-main)', renderer: 'var(--src-renderer)' }
const LEVEL_TEXT = { error: 'Error', warn: 'Warn', info: 'Info', debug: 'Debug' }
const LEVEL_MARK = { error: 'E', warn: 'W', info: 'I', debug: 'D' }

let seq = 0
/** 时间基准:从「现在」往前倒推仿真段的总时长(~11 分钟),让时间线终于现在,
    这样「模拟实时」追加的行(Date.now())接在历史段后面才自然 */
const T0 = Date.now() - 660_000
const AT = (s, ms = 0) => T0 + s * 1000 + ms

const boot = [
  // ── 启动序列:照真机代码里的句子手摆 ──
  { ts: AT(0),      source: 'main',     level: 'info',  name: 'gwb',          msg: '宿主进程起来了,开 fd3 桥' },
  { ts: AT(0, 62),  source: 'host',     level: 'info',  name: 'host',         msg: '新 home:D:\\god\\home' },
  { ts: AT(0, 118), source: 'host',     level: 'info',  name: 'loader',       msg: 'Loader initialized, config path: cordis.yml' },
  { ts: AT(0, 214), source: 'host',     level: 'info',  name: 'loader',       msg: 'Plugin plugin-timer@2 loaded in 31ms' },
  { ts: AT(0, 327), source: 'plugin',   level: 'info',  name: 'gwb-commands', msg: '命令总线就绪:已注册 6 条命令' },
  { ts: AT(0, 389), source: 'plugin',   level: 'debug', name: 'gwb-commands', msg: 'register kernel.info / echo / logs.tail / pane.open / home.open / datetime' },
  { ts: AT(0, 455), source: 'plugin',   level: 'info',  name: 'gwb-shell',    msg: '外壳上来了,占住整页根' },
  { ts: AT(0, 512), source: 'plugin',   level: 'debug', name: 'gwb-shell',    msg: 'importmap 注入完成:react / react-dom / gwb-tokens' },
  { ts: AT(0, 608), source: 'plugin',   level: 'info',  name: 'gwb-settings', msg: '设置件挂载,namespace: gwb' },
  { ts: AT(0, 673), source: 'plugin',   level: 'debug', name: 'gwb-settings', msg: 'settings.get theme → "dark"' },
  { ts: AT(0, 741), source: 'plugin',   level: 'info',  name: 'gwb-logger',   msg: '日志窗格已挂载,正在看四路流水' },
  { ts: AT(0, 802), source: 'renderer', level: 'info',  name: 'renderer',     msg: 'shell booted in 213ms' },
  { ts: AT(0, 844), source: 'renderer', level: 'debug', name: 'renderer',     msg: '[vite] connected.' },
  { ts: AT(0, 923), source: 'host',     level: 'warn',  name: 'loader',       msg: 'Plugin gwb-hmr is declared in cordis.yml but not installed, skipped' },
  { ts: AT(1, 30),  source: 'main',     level: 'warn',  name: 'gwb',          msg: '宿主还没起来,命令 kernel.info 收了但没处送' },
  { ts: AT(1, 260), source: 'plugin',   level: 'info',  name: 'gwb-shell',    msg: '窗格 main 已挂进井(duplicable)' },
]

/* 运行段模板池:按 [source, name] 分桶仿写。抽模板时按权重定级别 */
const RUN_POOL = [
  { source: 'plugin', name: 'gwb-commands', level: 'info',  msg: () => `命令 ${pick(['kernel.info', 'datetime', 'echo', 'home.open'])} 已执行(${2 + rnd(28)}ms)` },
  { source: 'plugin', name: 'gwb-commands', level: 'debug', msg: () => `dispatch ${pick(['kernel.info', 'datetime'])} → host` },
  { source: 'plugin', name: 'gwb-shell',    level: 'debug', msg: () => `布局快照已存(${300 + rnd(400)}B)` },
  { source: 'plugin', name: 'gwb-shell',    level: 'info',  msg: () => `窗格 ${pick(['main', 'settings'])} 激活` },
  { source: 'plugin', name: 'gwb-settings', level: 'debug', msg: () => `settings.${pick(['get', 'set'])} ${pick(['theme', 'shell.pinned', 'logger.cap'])} ${pick(['→ "dark"', '→ true', '→ 2000', '← ok'])}` },
  { source: 'plugin', name: 'plugin-timer', level: 'debug', msg: () => `tick every=${pick([15, 30, 60])}s,uptime=${rnd(9) + 1}m` },
  { source: 'host',   name: 'loader',       level: 'info',  msg: () => `Plugin ${pick(['gwb-commands', 'gwb-shell', 'gwb-settings', 'gwb-logger'])} reloaded in ${18 + rnd(60)}ms` },
  { source: 'host',   name: 'loader',       level: 'warn',  msg: () => `Plugin ${pick(['gwb-logger', 'gwb-settings'])} config has unknown key "${pick(['legacy', 'debugx', 'extra'])}", ignored` },
  { source: 'host',   name: 'host',         level: 'info',  msg: () => `fd3 批量上行:${5 + rnd(40)} 行` },
  { source: 'host',   name: 'stdin',        level: 'warn',  msg: () => `不合协议的行,已丢弃:${'{'}"t":"${pick(['ping', 'logx', 'cmd'])}"…${'}'}` },
  { source: 'main',   name: 'gwb',          level: 'info',  msg: () => `命令通道:${rnd(9) + 1} 条在飞` },
  { source: 'renderer', name: 'renderer',   level: 'debug', msg: () => `[vite] hmr update ${pick(['/src/client/index.tsx', '/src/pane.tsx'])}` },
  { source: 'renderer', name: 'renderer',   level: 'info',  msg: () => `pane "${pick(['logger', 'settings'])}" mounted in ${8 + rnd(40)}ms` },
  { source: 'renderer', name: 'renderer',   level: 'warn',  msg: () => `[Dockview] panel ${pick(['logger-1', 'settings-1'])} is already active, reuse` },
]
const RUN_WEIGHTS = [0.01, 0.07, 0.44, 0.48] // error/warn/info/debug 的量级,误差程序自带

/* 一条 error 多行(rejection 带堆栈)、一条长消息(折行),钉进运行段中间 */
const FEATURED = [
  { at: 0.42, entry: () => ({ source: 'host', level: 'error', name: 'host', msg: '没人接的 rejection(件挂载失败多半落这儿),宿主继续跑:\nTypeError: Cannot read properties of undefined (reading \'registerPane\')\n    at apply (gwb-demo/src/index.ts:12:19)\n    at Loader.wrap.apply (file:///D:/god/home/node_modules/@cordisjs/plugin-loader/lib/index.cjs:812:22)' }) },
  { at: 0.63, entry: () => ({ source: 'plugin', level: 'error', name: 'gwb-commands', msg: '命令 pane.open 派发失败:目标窗格 "no-such-pane" 不存在,来源 gwb-shell 拒收' }) },
  { at: 0.77, entry: () => ({ source: 'main', level: 'warn', name: 'gwb', msg: '命令 kernel.info 超时(5000ms 没回),回执按失败收' }) },
  { at: 0.88, entry: () => ({ source: 'plugin', level: 'info', name: 'gwb-shell', msg: '布局已恢复:dockview-grid {"activePanel":"logger","size":{"left":61.4,"right":38.6},"panels":["logger","settings"],"runtimeState":"hydrated-from-disk","version":3} ——这一条故意很长,看折行与列对齐' }) },
]

function rnd(n) { return Math.floor(Math.random() * n) }
function pick(arr) { return arr[rnd(arr.length)] }

function buildRun(total) {
  const out = []
  let t = 2.2 // 启动段之后接着走
  const feat = FEATURED.map((f) => ({ ...f, done: false }))
  for (let i = 0; i < total; i++) {
    for (const f of feat) {
      if (!f.done && i / total >= f.at) {
        f.done = true
        const e = f.entry()
        out.push({ ts: AT(t), ...e })
      }
    }
    const r = Math.random()
    const level = r < RUN_WEIGHTS[0] ? 'error' : r < RUN_WEIGHTS[0] + RUN_WEIGHTS[1] ? 'warn' : r < RUN_WEIGHTS[0] + RUN_WEIGHTS[1] + RUN_WEIGHTS[2] ? 'info' : 'debug'
    const tmpl = pick(RUN_POOL.filter((p) => p.level === level)) ?? pick(RUN_POOL)
    out.push({ ts: AT(t), source: tmpl.source, level: tmpl.level, name: tmpl.name, msg: tmpl.msg() })
    t += 0.4 + Math.random() * 2.6
  }
  feat.filter((f) => !f.done).forEach((f) => {
    const e = f.entry()
    out.push({ ts: AT(t), ...e })
  })
  return out
}

let entries = []
{
  let ts = AT(0)
  for (const b of boot) { b.seq = seq++; ts = b.ts; entries.push(b) }
  const run = buildRun(380)
  for (const r of run) { r.seq = seq++; entries.push(r) }
}

/* ══════════════ 状态与筛选(照 client 的 filter.ts 同一个路数) ══════════════ */
const filter = { level: 'debug', sources: new Set(SOURCES), key: '', search: '' }
let stick = true
const CAP = 2000
const STICK_SLACK = 24

const $ = (id) => document.getElementById(id)
const flow = $('flow'), empty = $('empty'), pausepill = $('pausepill')
const countEl = $('count'), pathEl = $('path')

function clockOf(ts) {
  const d = new Date(ts)
  const p = (n, w = 2) => String(n).padStart(w, '0')
  return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}.${p(d.getMilliseconds(), 3)}`
}
const keyOf = (e) => `${e.source}|${e.name}`
function matches(e) {
  if (SEVERITY[e.level] > SEVERITY[filter.level]) return false
  if (!filter.sources.has(e.source)) return false
  if (filter.key !== '' && keyOf(e) !== filter.key) return false
  if (filter.search !== '') {
    const n = filter.search.toLowerCase()
    if (!e.msg.toLowerCase().includes(n) && !e.name.toLowerCase().includes(n)) return false
  }
  return true
}
function countBySource(list) {
  const out = { plugin: 0, host: 0, main: 0, renderer: 0 }
  for (const e of list) out[e.source]++
  return out
}
function groupNames(list) {
  const by = new Map()
  for (const e of list) {
    if (!by.has(e.source)) by.set(e.source, new Set())
    by.get(e.source).add(e.name)
  }
  return SOURCES.filter((s) => by.has(s)).map((s) => ({ source: s, names: [...by.get(s)].sort() }))
}

/* ══════════════ 顶栏:级别分段 / 路 toggle / 来源下拉 ══════════════ */
const seg = $('seg')
for (const l of LEVELS) {
  const b = document.createElement('button')
  b.textContent = LEVEL_TEXT[l]
  b.title = `显示 ${LEVEL_TEXT[l]} 及以上`
  b.onclick = () => { filter.level = l; paintSeg(); render() }
  b.dataset.level = l
  seg.appendChild(b)
}
function paintSeg() {
  const cur = SEVERITY[filter.level]
  for (const b of seg.children) {
    const s = SEVERITY[b.dataset.level]
    b.className = s === cur ? 'on' : s < cur ? 'dim' : ''
  }
}

const srcbtns = $('srcbtns')
for (const s of SOURCES) {
  const b = document.createElement('button')
  b.className = 'srcbtn'
  b.title = `${SRC_LABEL[s]}这一路`
  b.onclick = () => {
    if (filter.sources.has(s)) filter.sources.delete(s)
    else filter.sources.add(s)
    paintSrc(); render()
  }
  b.innerHTML = `<span class="dot" style="background:${SRC_COLOR[s]}"></span><span>${SRC_LABEL[s]}</span><span class="n" data-n="${s}"></span>`
  b.dataset.source = s
  srcbtns.appendChild(b)
}
function paintSrc() {
  for (const b of srcbtns.children) b.classList.toggle('off', !filter.sources.has(b.dataset.source))
}
function paintCounts() {
  const c = countBySource(entries)
  for (const b of srcbtns.children) b.querySelector(`[data-n="${b.dataset.source}"]`).textContent = c[b.dataset.source]
}

/* 来源下拉:复合键 source|name,按路分组;弹层挂在本格容器内(仿 portal 的规矩) */
const selTrigger = $('selTrigger'), selPop = $('selPop'), selVal = $('selVal')
const TICK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
function paintSelLabel() {
  selVal.textContent = filter.key === '' ? '全部来源' : filter.key.split('|')[1]
}
function buildPop() {
  selPop.textContent = ''
  const all = document.createElement('div')
  all.className = 'sel-item'
  all.innerHTML = `<span class="tick">${filter.key === '' ? TICK : ''}</span>全部来源`
  all.onclick = () => { filter.key = ''; paintSelLabel(); buildPop(); render() }
  selPop.appendChild(all)
  for (const g of groupNames(entries)) {
    const label = document.createElement('div')
    label.className = 'sel-glabel'
    label.textContent = SRC_LABEL[g.source]
    selPop.appendChild(label)
    for (const n of g.names) {
      const item = document.createElement('div')
      item.className = 'sel-item'
      const k = `${g.source}|${n}`
      item.innerHTML = `<span class="tick">${filter.key === k ? TICK : ''}</span>${n}`
      item.onclick = () => { filter.key = k; paintSelLabel(); buildPop(); render() }
      selPop.appendChild(item)
    }
  }
}
selTrigger.onclick = (e) => {
  e.stopPropagation()
  buildPop()
  selPop.hidden = !selPop.hidden
}
document.addEventListener('click', (e) => {
  if (!selPop.hidden && !selPop.contains(e.target)) selPop.hidden = true
})

/* ══════════════ 渲染 ══════════════ */
let rows = []
function render() {
  const shown = entries.filter(matches)
  rows.forEach((r) => r.remove())
  rows = shown.map((e) => {
    const div = document.createElement('div')
    div.className = `row ${e.level}`
    div.innerHTML =
      `<span class="t">${clockOf(e.ts)}</span>` +
      `<span class="lv">${LEVEL_MARK[e.level]}</span>` +
      `<span class="src"><span class="dot" style="background:${SRC_COLOR[e.source]}" title="${SRC_LABEL[e.source]}"></span><span class="w">${SRC_LABEL[e.source]}</span></span>` +
      `<span class="name" title="${e.name}">${e.name}</span>` +
      `<span class="msg"></span>`
    div.querySelector('.msg').textContent = e.msg
    return div
  })
  const frag = document.createDocumentFragment()
  frag.append(...rows)
  flow.insertBefore(frag, empty)

  const filtering = filter.level !== 'debug' || filter.sources.size !== SOURCES.length || filter.key !== '' || filter.search !== ''
  if (shown.length === 0) {
    empty.hidden = false
    empty.textContent = ''
    const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
    icon.setAttribute('viewBox', '0 0 24 24'); icon.setAttribute('fill', 'none')
    icon.setAttribute('stroke', 'currentColor'); icon.setAttribute('stroke-width', '2')
    icon.setAttribute('stroke-linecap', 'round'); icon.setAttribute('stroke-linejoin', 'round')
    icon.innerHTML = '<path d="M15 12h-5"/><path d="M15 8h-5"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M8 21h12a2 2 0 0 0 2-2v-1a1 1 0 0 0-1-1H11a1 1 0 0 0-1 1v1a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v2a1 1 0 0 0 1 1h3"/>'
    empty.appendChild(icon)
    if (entries.length === 0) {
      empty.appendChild(document.createTextNode('还没有日志。'))
    } else {
      const wrap = document.createElement('span')
      wrap.textContent = `${entries.length} 条都被筛掉了。`
      const btn = document.createElement('button')
      btn.className = 'ghostbtn'
      btn.textContent = '清筛选'
      btn.onclick = () => {
        filter.level = 'debug'; filter.sources = new Set(SOURCES); filter.key = ''; filter.search = ''
        $('q').value = ''
        paintSeg(); paintSrc(); paintSelLabel(); buildPop(); render()
      }
      empty.appendChild(wrap)
      empty.appendChild(btn)
    }
  } else {
    empty.hidden = true
  }

  countEl.textContent = filtering ? `${shown.length} / ${entries.length} 条` : `${entries.length} 条`
  if (entries.length >= CAP) countEl.textContent += `(挂满 ${CAP},更早的去日志文件翻)`
}

$('clear').onclick = () => { entries = []; paintCounts(); render() }
$('q').oninput = (e) => { filter.search = e.target.value.trim(); render() }
pathEl.textContent = 'D:\\god\\home\\logs'

/* ══════════════ 吸附 ══════════════ */
function follow() { if (stick) flow.scrollTop = flow.scrollHeight }
flow.addEventListener('scroll', () => {
  stick = flow.scrollHeight - flow.scrollTop - flow.clientHeight < STICK_SLACK
  pausepill.hidden = stick
})
pausepill.onclick = () => { stick = true; pausepill.hidden = true; follow() }
const _render = render
render = function () { _render(); follow() }

/* ══════════════ 模拟实时(效果图自有) ══════════════ */
let liveTimer = null
$('live').onclick = () => {
  const btn = $('live')
  if (liveTimer !== null) {
    clearInterval(liveTimer); liveTimer = null
    btn.classList.remove('on'); btn.lastChild.textContent = '模拟实时'
    return
  }
  btn.classList.add('on'); btn.lastChild.textContent = '停止模拟'
  liveTimer = setInterval(() => {
    const r = Math.random()
    const level = r < 0.02 ? 'error' : r < 0.09 ? 'warn' : r < 0.55 ? 'info' : 'debug'
    const tmpl = pick(RUN_POOL.filter((p) => p.level === level)) ?? pick(RUN_POOL)
    entries.push({ seq: seq++, ts: Date.now(), source: tmpl.source, level: tmpl.level, name: tmpl.name, msg: tmpl.msg() })
    paintCounts(); render()
  }, 700)
}

/* 首画 */
paintSeg(); paintSrc(); paintCounts(); paintSelLabel(); render()
</script>
</body>
</html>
