# 这个件的 python 半，同时是**消费方照抄的模板**：一个件要跑 python CLI，它的 `py/` 就长这样。
#
# 三处跟 gwb-py-cli 的守卫对得上，改名字要一起改（`tests/artifact.test.ts` 钉着这三处）：
# - `name` 与 `version` → 件登记时给的 distName / version，守卫拿它比对 dist-info 目录名
# - `[project.scripts]` 的入口点 → 守卫在 venv 里生成 `<名>.exe` 垫片，spawn 的就是它
# - `uv.lock` 必须在：守卫跑的是 `uv sync --frozen`，没锁文件当场失败
#
# venv 不在这儿——它由守卫在件挂载时现建（件装进 node_modules，venv 也就在 node_modules 里）。

[project]
name = "gwb-hello-py"
version = "0.0.1"
description = "gwb-hello 的 python 半：在 venv 里跑起来，打一行 JSON"
requires-python = ">=3.10"
dependencies = []

# 入口点垫片。件登记时给 command: "gwb-hello-py"
[project.scripts]
gwb-hello-py = "gwb_hello_py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gwb_hello_py"]
